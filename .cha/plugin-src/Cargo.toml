[workspace]

[package]
name = "api-misuse"
version = "0.53.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
cha-plugin-sdk = { git = "https://github.com/W-Mai/Cha", tag = "v1.20.0" }
wit-bindgen = "0.55"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
