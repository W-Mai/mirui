[package]
name = "mirui"
version = "0.50.0"
edition = "2024"
authors = ["Benign X <1341398182@qq.com>"]
license = "MIT"
description = "A lightweight, no_std ECS-driven UI framework for embedded, mobile, desktop, and WebAssembly"
repository = "https://github.com/W-Mai/mirui"
homepage = "https://mirui.rs"
documentation = "https://docs.rs/mirui"
readme = "README.md"
keywords = ["ui", "gui", "ecs", "embedded", "no-std"]
categories = ["gui", "embedded"]
rust-version = "1.85"

[workspace]
members = [".", "xtask", "mirui-macros", "mirx", "gallery", "gallery/web"]

[dependencies]
mirui-macros = { version = "0.50.0", path = "mirui-macros" }
mirx = { version = "0.50.0", path = "mirx" }
textflow-rs = { version = "0.3.3", default-features = false, features = ["alloc", "script-arabic", "script-devanagari", "script-thai"] }
critical-section = { version = "1.2", default-features = false }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
rustc-hash = { version = "2", default-features = false }

[features]
default = ["quad-aa", "log-stderr"]
std = ["critical-section/std", "dep:web-time"]
log-stderr = ["std"]
log-nuttx-syslog = ["std"]
log-bridge = ["std", "dep:log"]
tracing-bridge = ["std", "dep:tracing"]
# Compile-time max level (pick at most one); anything above the cap
# expands to `if false` and gets DCE'd. Default picks none: runtime gate.
log-max-level-off = []
log-max-level-error = []
log-max-level-warn = []
log-max-level-info = []
log-max-level-debug = []
log-max-level-trace = []
log-web-console = ["web-canvas"]
sdl = ["dep:sdl2", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-uniform-type-identifiers", "dep:objc2-ui-kit", "dep:objc2-core-foundation", "dep:block2", "dep:windows", "dep:windows-sys", "dep:raw-window-handle", "dep:url", "dep:x11rb", "dep:x11-dl", "dep:rustix", "dep:wayland-client", "std"]
sdl-gpu = ["sdl", "dep:sdl2-sys", "dep:lyon"]
wgpu = ["dep:wgpu", "dep:winit", "dep:bytemuck", "dep:lyon", "dep:pollster", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-uniform-type-identifiers", "dep:objc2-ui-kit", "dep:objc2-core-foundation", "dep:block2", "dep:windows", "dep:windows-sys", "dep:raw-window-handle", "dep:url", "dep:x11rb", "dep:x11-dl", "dep:rustix", "dep:wayland-client", "std"]
wgpu-android = ["wgpu", "winit/android-native-activity"]
web-canvas = [
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:futures-channel",
    "std",
    "log-web-console",
]
linux-fb = ["dep:memmap2", "dep:evdev", "dep:libc", "dep:signal-hook", "std"]
linux-drm = ["dep:drm", "dep:drm-ffi", "dep:evdev", "dep:libc", "dep:signal-hook", "std"]
nuttx = ["dep:libc", "std", "log-nuttx-syslog"]
perf = []
sync-cache = []
persistence = ["dep:serde", "dep:postcard"]
# Anti-aliasing for 3D-transformed quads. On `std` this uses a Fixed64
# signed-distance field for smooth coverage; on `no_std` it degrades to
# a 2×2 supersample (5 coverage steps). Disable to get the old v0.9.x
# hard-edge binary fill back — embedded targets that can't spare the
# cycles should `default-features = false`.
quad-aa = []
gallery = []
audio = []
web-audio = ["audio", "web-canvas"]
sdl-audio = ["audio", "sdl"]

[dependencies.sdl2]
version = "0.37"
optional = true

[dependencies.sdl2-sys]
version = "0.37"
optional = true

[dependencies.lyon]
version = "1.0"
optional = true

[dependencies.wgpu]
version = "29"
optional = true

[dependencies.winit]
version = "0.30"
optional = true

[dependencies.bytemuck]
version = "1"
features = ["derive"]
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSString", "NSObject", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3", optional = true, default-features = false, features = ["std", "UTType"] }

[target.'cfg(target_os = "macos")'.dependencies]
sdl2 = { version = "0.37", optional = true, features = ["raw-window-handle"] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep", "NSResponder"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "UIPasteboard", "UIImage", "UIGraphicsImageRenderer", "UIGraphicsRenderer", "objc2-core-foundation", "objc2-core-graphics", "block2"] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = ["std"] }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
sdl2 = { version = "0.37", optional = true, features = ["raw-window-handle"] }
raw-window-handle = { version = "0.6", optional = true }
url = { version = "2.5", optional = true }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Globalization", "Win32_UI_Shell"] }
windows = { version = "0.62", optional = true, default-features = false, features = ["std", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

# Drop-in replacement for `std::time` on `wasm32-unknown-unknown` —
# native targets re-export `std::time` at zero cost; wasm reads
# `performance.now()` so `Instant::now()` doesn't panic.
[dependencies.web-time]
version = "1.1"
optional = true

# Linux display and input dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { version = "0.37", optional = true, features = ["raw-window-handle"] }
raw-window-handle = { version = "0.6", optional = true }
x11rb = { version = "0.13.2", optional = true }
x11-dl = { version = "2.21", optional = true }
rustix = { version = "1", optional = true, features = ["event", "net", "fs", "pipe"] }
wayland-client = { version = "0.31.15", optional = true, features = ["system", "dlopen"] }
memmap2 = { version = "0.9", optional = true }
evdev = { version = "0.13", optional = true }
signal-hook = { version = "0.3", optional = true }
drm = { version = "0.14", optional = true }
drm-ffi = { version = "0.9", optional = true }

# `libc` is needed on both linux (fbdev / drm) and nuttx (fb + touch +
# keyboard) backends, so it lives at the top level rather than under a
# target-specific table.
[dependencies.libc]
version = "0.2"
optional = true
default-features = false

[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "alloc"]
optional = true

[dependencies.postcard]
version = "1"
default-features = false
features = ["alloc"]
optional = true

[dependencies.log]
version = "0.4"
default-features = false
optional = true

[dependencies.tracing]
version = "0.1"
default-features = false
optional = true

# wasm32-only deps for the web-canvas backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = { version = "0.3", optional = true }
web-sys = { version = "0.3.99", optional = true, features = [
    "Window",
    "Navigator",
    "Clipboard",
    "ClipboardItem",
    "ClipboardEvent",
    "DataTransfer",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlTextAreaElement",
    "CompositionEvent",
    "InputEvent",
    "FocusEvent",
    "FocusOptions",
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "CanvasWindingRule",
    "CssStyleDeclaration",
    "DomMatrix",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "ImageData",
    "Path2d",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "KeyboardEvent",
    "TouchEvent",
    "Touch",
    "TouchList",
    "DomRect",
    "EventTarget",
    "Event",
    "Storage",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "BaseAudioContext",
    "DynamicsCompressorNode",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "console",
] }
js-sys = { version = "0.3.99", optional = true }
wasm-bindgen = { version = "0.2.122", optional = true }
wasm-bindgen-futures = { version = "0.4.72", optional = true }

[dev-dependencies]
crc32fast = "1"
trybuild = "1"

[target.'cfg(target_os = "ios")'.dev-dependencies]
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGContext", "CGColorSpace", "CGImage"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["UIGraphics"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
x11rb = "0.13.2"
rustix = { version = "1", features = ["event", "net", "fs", "pipe", "process"] }
wayland-client = "0.31.15"
wayland-server = "0.31"

[[test]]
name = "native_clipboard"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
