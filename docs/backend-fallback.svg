<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MIRUI backend routing and exact fallback flow</title>
  <desc id="desc">A draw request either follows a native backend route or a bounded exact software fallback with one coordinate quantization, one optional readback, local replay, and one writeback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10172a"/>
    </linearGradient>
    <linearGradient id="native" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16c79a"/>
      <stop offset="1" stop-color="#53e3c2"/>
    </linearGradient>
    <linearGradient id="fallback" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#63738f"/>
    </marker>
    <style>
      .card{fill:#111c2e;stroke:#33435d;stroke-width:1.5}.muted{fill:#94a3b8}.label{fill:#dbe7f5;font:600 15px ui-sans-serif,system-ui,sans-serif}.title{fill:#f8fafc;font:700 28px ui-sans-serif,system-ui,sans-serif}.subtitle{fill:#9fb0c7;font:400 15px ui-sans-serif,system-ui,sans-serif}.mono{fill:#c8d5e6;font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace}.small{fill:#8fa1ba;font:400 12px ui-sans-serif,system-ui,sans-serif}.arrow{fill:none;stroke:#63738f;stroke-width:2;marker-end:url(#arrow)}.native-line{stroke:#2dd4bf}.fallback-line{stroke:#a78bfa}.chip{fill:#17243a;stroke:#34465f}.pulse{filter:url(#glow)}
      .flow{stroke-dasharray:8 9;animation:flow 1.1s linear infinite}.gate-pulse{animation:gatePulse 2.8s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-34}}
      @keyframes gatePulse{0%,100%{stroke:#33435d}35%,55%{stroke:#a78bfa}70%{stroke:#33435d}}
      @media (prefers-reduced-motion:reduce){.flow,.gate-pulse{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="52" y="58" class="title">One request, one exact route</text>
  <text x="52" y="86" class="subtitle">Native work stays native. Exceptional semantics cross one bounded fallback scope.</text>

  <rect x="52" y="124" width="190" height="94" rx="16" class="card"/>
  <circle cx="82" cy="155" r="10" fill="#60a5fa"/>
  <text x="104" y="161" class="label">DrawRequest</text>
  <text x="76" y="190" class="mono">command · clip</text>
  <text x="76" y="208" class="mono">projective</text>

  <path d="M242 171H302" class="arrow"/>
  <path d="M350 124L402 171L350 218L298 171Z" class="card gate-pulse"/>
  <text x="350" y="166" text-anchor="middle" class="small">exact native</text>
  <text x="350" y="183" text-anchor="middle" class="small">semantics?</text>

  <path d="M402 171H494" class="arrow native-line"/>
  <text x="431" y="151" class="small" fill="#65e6cd">yes</text>
  <rect x="496" y="124" width="240" height="94" rx="16" class="card" stroke="#1f8f7c"/>
  <rect x="516" y="142" width="74" height="24" rx="12" fill="#123f3b"/>
  <text x="553" y="159" text-anchor="middle" class="small" fill="#62e5ca">NATIVE</text>
  <text x="516" y="190" class="label">Backend draw</text>
  <text x="516" y="209" class="small">Software · WGPU · SDL · Web</text>
  <path d="M736 171H966" class="arrow native-line flow"/>

  <path d="M350 218V289H414" class="arrow fallback-line"/>
  <text x="366" y="248" class="small" fill="#c4b5fd">no</text>
  <rect x="416" y="252" width="304" height="142" rx="18" class="card" stroke="#7053b7"/>
  <rect x="436" y="271" width="94" height="24" rx="12" fill="#2d1d57"/>
  <text x="483" y="288" text-anchor="middle" class="small" fill="#c4b5fd">ONE BOUNDARY</text>
  <text x="436" y="320" class="label">Quantize and clip once</text>
  <text x="436" y="348" class="mono">Rect&lt;Fixed&gt; → i32 edges</text>
  <text x="436" y="371" class="mono">→ PhysicalRect&lt;u16&gt;</text>
  <path d="M720 323H746" class="arrow fallback-line flow"/>
  <rect x="748" y="252" width="198" height="142" rx="18" class="card" stroke="#8c652b"/>
  <rect x="768" y="271" width="90" height="24" rx="12" fill="#493413"/>
  <text x="813" y="288" text-anchor="middle" class="small" fill="#ffc766">PREFLIGHT</text>
  <text x="768" y="320" class="label">Memory contract</text>
  <text x="768" y="346" class="mono">stride : usize</text>
  <text x="768" y="367" class="mono">capacity : usize</text>
  <text x="768" y="386" class="small">address + row alignment</text>

  <path d="M946 323H960V458H169" class="arrow fallback-line flow"/>

  <rect x="94" y="482" width="228" height="110" rx="17" class="card"/>
  <text x="116" y="516" class="label">1 · Read target</text>
  <text x="116" y="544" class="small">Only when destination pixels</text>
  <text x="116" y="564" class="small">affect the result</text>

  <path d="M322 537H394" class="arrow fallback-line"/>
  <rect x="396" y="482" width="228" height="110" rx="17" class="card"/>
  <text x="418" y="516" class="label">2 · Local replay</text>
  <text x="418" y="544" class="small">Software renders inside the</text>
  <text x="418" y="564" class="small">same bounded RGBA plane</text>

  <path d="M624 537H696" class="arrow fallback-line"/>
  <rect x="698" y="482" width="228" height="110" rx="17" class="card"/>
  <text x="720" y="516" class="label">3 · Write once</text>
  <text x="720" y="544" class="small">Replace or composite the exact</text>
  <text x="720" y="564" class="small">physical destination region</text>

  <path d="M926 537H966" class="arrow fallback-line flow"/>
  <rect x="968" y="124" width="180" height="468" rx="20" fill="#0c1728" stroke="#3b4d68" stroke-width="1.5"/>
  <circle cx="1058" cy="187" r="31" fill="#122a34" stroke="#2dd4bf" stroke-width="2"/>
  <path d="M1043 188L1054 199L1075 176" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1058" y="239" text-anchor="middle" class="label">Target</text>
  <text x="1058" y="263" text-anchor="middle" class="small">same pixels</text>
  <text x="1058" y="281" text-anchor="middle" class="small">same semantics</text>
  <path d="M990 325H1126" stroke="#263750" stroke-width="1"/>
  <text x="990" y="359" class="small">Failure is atomic:</text>
  <text x="990" y="383" class="mono">missing storage</text>
  <text x="990" y="405" class="mono">bad alignment</text>
  <text x="990" y="427" class="mono">capacity overflow</text>
  <text x="990" y="459" class="small">stop before write</text>

  <rect x="52" y="632" width="1096" height="44" rx="14" fill="#0a1423" stroke="#263750"/>
  <circle cx="78" cy="654" r="6" fill="url(#native)"/>
  <text x="94" y="659" class="small">common path: no fallback allocation or transfer</text>
  <circle cx="430" cy="654" r="6" fill="url(#fallback)"/>
  <text x="446" y="659" class="small">exception path: clipped bytes, explicit budget, reusable storage</text>
</svg>
