<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mirui task list</title>
    <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-sign-ext --enable-nontrapping-float-to-int">
    <style>
      body { margin: 0; color-scheme: light dark; background: Canvas; }
      canvas { display: block; width: min(420px, 100%); height: 440px; margin: auto; }
    </style>
  </head>
  <body>
    <canvas id="tutorial" tabindex="0" aria-label="Task list"></canvas>
    <script>
      window.addEventListener('TrunkApplicationStarted', () => {
        const dark = matchMedia('(prefers-color-scheme: dark)');
        const reduced = matchMedia('(prefers-reduced-motion: reduce)');
        const chapter = Number(new URLSearchParams(location.search).get('chapter')) || 7;
        const canvas = document.getElementById('tutorial');
        const app = new window.wasmBindings.Tutorial(canvas, chapter, reduced.matches, dark.matches, true);
        const draw = () => {
          if (!app.tick()) requestAnimationFrame(draw);
        };
        requestAnimationFrame(draw);
        dark.addEventListener('change', () => app.set_dark(dark.matches));
      }, { once: true });
    </script>
  </body>
</html>
