<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mirui task list</title>
    <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-sign-ext --enable-nontrapping-float-to-int">
    <link data-trunk rel="copy-file" href="preview-frame.js">
    <link data-trunk rel="css" href="../../../gallery/web/device-frame.css">
    <style>
      html { color-scheme: light dark; }
      body { --site-panel: Canvas; --site-rule-strong: #8886; --site-blue: #536eff; --site-muted: CanvasText; --rim-top: #8882; margin: 0; padding: 24px; background: Canvas; }
      main { max-width: 1120px; margin: auto; --preview-width: min(100%, 640px); --preview-height: clamp(340px, 70vh, 700px); }
    </style>
  </head>
  <body>
    <main><div class="preview-frame"><canvas id="tutorial" tabindex="0" aria-label="Task list"></canvas></div></main>
    <script type="module">
      import { mountPreviewFrame } from "./preview-frame.js";
      mountPreviewFrame(document.querySelector(".preview-frame"));
      function start() {
        const dark = matchMedia('(prefers-color-scheme: dark)');
        const reduced = matchMedia('(prefers-reduced-motion: reduce)');
        const chapter = Number(new URLSearchParams(location.search).get('chapter')) || 7;
        const canvas = document.getElementById('tutorial');
        const app = new window.wasmBindings.Tutorial(canvas, chapter, reduced.matches, dark.matches, true);
        const draw = () => {
          if (!app.tick()) requestAnimationFrame(draw);
        };
        requestAnimationFrame(draw);
        dark.addEventListener('change', () => app.set_dark(dark.matches));
      }
      if (window.wasmBindings) start();
      else window.addEventListener('TrunkApplicationStarted', start, { once: true });
    </script>
  </body>
</html>
