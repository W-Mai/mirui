      <use xlink:href="#slice-6" transform="matrix(5.6 1.5 -2.9 2.1 0 -28)"/>
      <use xlink:href="#slice-6" transform="matrix(5.6 1.5 -2.9 2.1 0 -32)"/>
      <use xlink:href="#slice-6" transform="matrix(5.6 1.5 -2.9 2.1 0 -36)"/>
