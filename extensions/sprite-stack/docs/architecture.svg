  <g fill="none" stroke="#75948e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M546 594h42m-7-6 7 6-7 6"/>
    <path d="M774 594h42m-7-6 7 6-7 6"/>
  </g>
  <g class="body" font-weight="650">
    <text x="385" y="647">Place objects</text>
    <text x="618" y="647">Select detail</text>
    <text x="850" y="647">Test depth</text>
  </g>
  <g class="small">
    <text x="385" y="675">Each Object has a pose</text>
    <text x="385" y="698">and shared geometry.</text>
    <text x="618" y="675">Choose a stored LOD</text>
    <text x="618" y="698">by projected cell size.</text>
    <text x="850" y="675">Reuse the tile. The nearer</text>
    <text x="850" y="698">opaque surface is visible.</text>
  </g>
