<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 768" width="1120" height="768" role="img" aria-labelledby="title desc">
  <title id="title">SpriteStack · from atlas to stage</title>
  <desc id="desc">The car.mirx atlas contains eleven horizontal slices. SSTK is optional in a MIRX image and required to interpret it as a sprite stack. Its records give each slice a position in the stack with a common pivot and spacing. A SpriteStack widget projects one sprite into an offscreen output. A StackStage groups entities with models and height fields. Each StackViewport draws its stage, chooses detail for its camera and depth-tests visible geometry in reusable tiles.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { fill: #f3f0dc; font-size: 44px; font-weight: 700; }
      .lead { fill: #ccd6cf; font-size: 20px; }
      .step { fill: #132c32; font-size: 24px; font-weight: 700; }
      .note { fill: #2f4b4c; font-size: 17px; }
      .api { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 24px; font-weight: 600; }
      .body { fill: #e1e7dc; font-size: 17px; }
      .small { fill: #bbcfc6; font-size: 16px; }
    </style>
    <pattern id="paper-grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c9d4c6"/>
    </pattern>
    <pattern id="tile-grid" width="14" height="14" patternUnits="userSpaceOnUse">
