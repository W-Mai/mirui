      <use xlink:href="#slice-2" transform="matrix(5.6 1.5 -2.9 2.1 0 -12)"/>
      <use xlink:href="#slice-4" transform="matrix(5.6 1.5 -2.9 2.1 0 -16)"/>
      <use xlink:href="#slice-5" transform="matrix(5.6 1.5 -2.9 2.1 0 -20)"/>
