      <path fill="#e03d29" d="M10 5h2v1h-2zM10 13h2v1h-2zM10 11h3v1h-3zM10 10h6v1h-6zM10 8h8v1h-8zM10 3h12v2h-12zM10 7h12v1h-12zM10 9h12v1h-12zM11 14h5v1h-5zM11 6h11v1h-11zM12 12h2v1h-2zM13 5h1v1h-1zM13 13h3v1h-3zM14 11h1v1h-1zM15 5h1v1h-1zM17 5h1v1h-1zM17 10h3v1h-3zM18 12h2v2h-2zM18 14h4v1h-4zM19 5h1v1h-1zM19 11h1v1h-1zM19 8h3v1h-3zM21 10h1v1h-1zM21 12h1v2h-1z"/>
    </g>
