      <path fill="#e03d29" d="M0 1h2v3h-2zM0 14h2v4h-2zM0 4h32v10h-32zM3 1h6v2h-6zM3 15h6v3h-6zM10 1h12v3h-12zM10 14h12v4h-12zM23 1h6v2h-6zM23 15h6v3h-6zM30 1h2v3h-2zM30 14h2v4h-2z"/>
    </g>
    <g id="slice-2">
      <path fill="#2e363d" d="M2 1h1v2h-1zM2 15h1v3h-1zM2 0h8v1h-8zM2 3h8v1h-8zM2 14h8v1h-8zM2 18h8v1h-8zM9 1h1v2h-1zM9 15h1v3h-1zM22 1h1v2h-1zM22 15h1v3h-1zM22 0h8v1h-8zM22 3h8v1h-8zM22 14h8v1h-8zM22 18h8v1h-8zM29 1h1v2h-1zM29 15h1v3h-1z"/>
      <path fill="#e03d29" d="M0 1h2v3h-2zM0 14h2v4h-2zM0 4h32v10h-32zM3 1h6v1h-6zM3 17h6v1h-6zM10 1h12v3h-12zM10 14h12v4h-12zM23 1h6v1h-6zM23 17h6v1h-6zM30 1h2v3h-2zM30 14h2v4h-2z"/>
    </g>
