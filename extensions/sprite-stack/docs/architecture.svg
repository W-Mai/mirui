      <use xlink:href="#slice-6" transform="translate(64 38)"/>
      <use xlink:href="#slice-6" transform="translate(0 57)"/>
      <use xlink:href="#slice-10" transform="translate(32 57)"/>
    </g>
    <g id="car">
      <use xlink:href="#slice-0" transform="matrix(5.6 1.5 -2.9 2.1 0 0)"/>
