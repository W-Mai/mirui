  <rect width="1120" height="768" rx="20" fill="#101e26"/>
  <text x="40" y="69" class="title">SpriteStack</text>
  <text x="41" y="103" class="lead">A layered MIRX sprite can appear in a widget or share a world with other objects.</text>

  <rect x="40" y="130" width="1040" height="314" rx="12" fill="#e8ecdc"/>
  <path fill="url(#paper-grid)" d="M55 190h1010v149H55z"/>
  <g class="step">
    <text x="64" y="172">Read the atlas</text>
    <text x="414" y="172">Align the layers</text>
    <text x="751" y="172">Project the model</text>
  </g>

  <g transform="translate(111 196) scale(1.78)">
    <rect width="96" height="76" fill="#f7f8eb"/>
    <use xlink:href="#atlas"/>
    <path d="M0 0h96v76H0z M32 0v76 M64 0v76 M0 19h96 M0 38h96 M0 57h96" fill="none" stroke="#90a6a0" stroke-width=".7"/>
  </g>
  <g fill="none" stroke="#377967" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 259h42m-8-7 8 7-8 7"/>
    <path d="M679 259h42m-8-7 8 7-8 7"/>
  </g>
    <g transform="matrix(4.5 1.12 -2.3 1.75 507 266)">
      <path fill="#f7f8e9" fill-opacity=".85" stroke="#88a5a0" stroke-width=".32" d="M0 0h32v19H0z"/>
