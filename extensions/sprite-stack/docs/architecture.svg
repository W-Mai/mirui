    </g>
    <g transform="matrix(4.5 1.12 -2.3 1.75 507 186)">
      <path fill="#f7f8e9" fill-opacity=".85" stroke="#88a5a0" stroke-width=".32" d="M0 0h32v19H0z"/>
      <use xlink:href="#slice-10"/>
    </g>
  <path d="M557 203v109" stroke="#365e58" stroke-dasharray="3 4" fill="none"/>
  <g fill="#f3f0dc" stroke="#2d675a" stroke-width="2">
    <circle cx="557" cy="301" r="3"/><circle cx="557" cy="261" r="3"/><circle cx="557" cy="221" r="3"/>
  </g>
  <g transform="translate(854 258)">
    <path d="m-51 48 169 45 69-47L31 5z" fill="#abc2b7"/>
    <use xlink:href="#car"/>
  </g>
  <g class="note">
    <text x="64" y="374">IMAGE stores 11 slices of 32 × 19 px.</text>
    <text x="64" y="401">SSTK records order, pivot and spacing.</text>
    <text x="414" y="374">Three slices share the pivot shown.</text>
    <text x="414" y="401">Height = layer index × spacing.</text>
    <text x="751" y="374">Yaw turns the car around its pivot.</text>
    <text x="751" y="401">Pitch reveals the layer tops or edges.</text>
  </g>

  <rect x="40" y="470" width="300" height="268" rx="12" fill="#183039" stroke="#39565d"/>
  <rect x="360" y="470" width="720" height="268" rx="12" fill="#183039" stroke="#39565d"/>
  <text x="62" y="514" class="api" fill="#84e0bb">SpriteStack</text>
  <text x="62" y="543" class="body">Display one sprite in the UI.</text>
  <g transform="translate(68 560)">
    <rect width="240" height="70" fill="#263f47" rx="6" stroke="#557078"/>
    <path d="M11 20v-9h9m200 0h9v9m0 30v9h-9m-200 0h-9v-9" fill="none" stroke="#84e0bb" stroke-width="2"/>
    <g transform="translate(91 26) scale(.49)"><use xlink:href="#car"/></g>
  </g>
  <text x="62" y="670" class="small">Draw the ordered slices into</text>
  <text x="62" y="695" class="small">the widget’s offscreen output.</text>

  <text x="385" y="514" class="api" fill="#ffd080">StackStage</text>
  <path d="M546 506h39m-7-6 7 6-7 6" fill="none" stroke="#ffd080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="603" y="514" class="api" fill="#ffd080">StackViewport</text>
  <text x="385" y="543" class="body">Place models and height fields once. Each camera draws its own view.</text>
  <g transform="translate(388 565)">
    <path d="m0 27 65 22 60-27L61 2z" fill="#284951" stroke="#779b93"/>
    <path d="m22 18 64 21m-44-30 65 21m-65 12 60-27m-82 20 61-26" fill="none" stroke="#53716f"/>
    <g transform="translate(32 16) scale(.24)"><use xlink:href="#car"/></g>
  </g>
  <g transform="translate(622 566)">
