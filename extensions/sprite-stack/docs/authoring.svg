<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="962" viewBox="0 0 1120 962" role="img" aria-labelledby="title desc">
  <title id="title">Build a rotating SpriteStack in Rust</title>
  <desc id="desc">A walkthrough of examples/turntable.rs. The app opens car.mirx, registers the SpriteStack view, creates a Turntable model and gives the same model to the timer and the view. Every 32 milliseconds the timer advances the observed heading by two degrees. The yaw binding reads the heading to rotate the rendered sprite. Changing the step to four degrees halves the number of timer callbacks per turn.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "DejaVu Sans", sans-serif; fill: #f3f0dc; }
      .title { font-size: 43px; font-weight: 700; }
      .lead { font-size: 20px; fill: #c8d8d3; }
      .heading { font-size: 25px; font-weight: 650; }
      .body { font-size: 18px; fill: #cadbd5; }
      .mono, .code, .mono text, .code text { font-family: ui-monospace, "SFMono-Regular", Menlo, "DejaVu Sans Mono", monospace; }
      .mono { font-size: 17px; }
      .code { font-size: 18px; }
      .kw { fill: #a9c9f2; }
      .asset { fill: #f7c475; }
      .angle { fill: #82dfbb; }
      .dark { fill: #142c31; }
      .label { fill: #b9ccc8; }
    </style>
  </defs>
  <rect width="1120" height="962" rx="18" fill="#101e26"/>
  <text x="40" y="64" class="title">Build a rotating SpriteStack</text>
  <text x="40" y="102" class="lead">Open examples/turntable.rs to follow the car from its atlas to a live yaw binding.</text>

  <rect x="40" y="130" width="1040" height="290" rx="12" fill="#192c35" stroke="#3b5660"/>
  <text x="64" y="169" class="heading">Wire the asset, timer and view in <tspan class="asset">main</tspan></text>
  <g class="code">
    <text x="64" y="210"><tspan class="kw">let</tspan> car = <tspan class="asset">SpriteStackAsset::from_mirx</tspan>(include_bytes!("car.mirx"))</text>
    <text x="107" y="235">.expect("embedded car atlas");</text>
    <text x="64" y="275">app.with_offscreen_pool_budget(1024 * 1024).with_widget(view());</text>
    <text x="64" y="304"><tspan class="kw">let</tspan> table = app.add_model(Turntable { heading: 0 }).finish();</text>
    <text x="64" y="333">app.add_timer(rotate::timer(<tspan class="angle">table.clone()</tspan>));</text>
    <text x="64" y="362"><tspan class="kw">let</tspan> root = app.spawn_root().id();</text>
    <text x="64" y="391">app.compose(root, preview(Handle::new(car), <tspan class="angle">table</tspan>));</text>
  </g>
  <path d="M804 192v208" stroke="#445d64"/>
  <text x="829" y="215" class="heading asset">At startup</text>
  <g class="body">
    <text x="829" y="249">Load the atlas once.</text>
    <text x="829" y="285">The SDL example also</text>
    <text x="829" y="308">installs a clock and the</text>
    <text x="829" y="331">default systems.</text>
    <text x="829" y="371">Both handles refer to</text>
    <text x="829" y="394">one Turntable model.</text>
  </g>

  <rect x="40" y="442" width="506" height="389" rx="12" fill="#172d35" stroke="#3b5960"/>
  <rect x="568" y="442" width="512" height="389" rx="12" fill="#172d35" stroke="#3b5960"/>
  <text x="64" y="482" class="heading">Advance an observed angle</text>
  <text x="592" y="482" class="heading">Read that angle in <tspan class="angle">preview</tspan></text>
  <g class="code">
    <text x="64" y="523" class="kw">#[model]</text>
    <text x="64" y="547"><tspan class="kw">struct</tspan> Turntable {</text>
    <text x="107" y="571" class="kw">#[observe]</text>
    <text x="107" y="595"><tspan class="angle">heading</tspan>: u16,</text>
    <text x="64" y="619">}</text>
  </g>
  <text x="64" y="654" class="mono label">Inside Turntable::advance</text>
  <text x="64" y="681" class="code">self.heading = (self.heading + <tspan class="angle">2</tspan>) % 360;</text>
  <path d="M64 701h458" stroke="#3b5960"/>
  <g class="code">
    <text x="64" y="731" class="kw">#[timer(every = 32)]</text>
    <text x="64" y="755"><tspan class="kw">fn</tspan> rotate(table: model!(Turntable)) {</text>
    <text x="107" y="779">table.advance();</text>
    <text x="64" y="803">}</text>
  </g>
  <g class="code">
    <text x="592" y="523"><tspan class="kw">ui!</tspan> {</text>
    <text x="614" y="548"><tspan class="asset">SpriteStack</tspan> (</text>
    <text x="635" y="573">grow: 1.0,</text>
    <text x="635" y="598">asset: car,</text>
    <text x="635" y="623"><tspan class="angle">yaw</tspan>: ${ Fixed::from(table.heading()) },</text>
    <text x="635" y="648">pitch: 28,</text>
    <text x="635" y="673">scale: 4</text>
    <text x="614" y="698">)</text>
    <text x="592" y="723">}</text>
  </g>
  <path d="M592 745h464" stroke="#3b5960"/>
  <text x="592" y="776" class="body">The binding updates yaw in degrees when</text>
  <text x="592" y="801" class="body">heading changes. The widget redraws the car.</text>

  <rect x="40" y="852" width="1040" height="80" rx="10" fill="#e8ecdc"/>
  <text x="64" y="888" class="heading dark">Try a faster turn</text>
  <text x="64" y="914" class="body dark">In advance, change + 2 to + 4.</text>
  <g class="mono dark">
    <text x="415" y="884" class="dark">+2°</text>
    <text x="415" y="913" class="dark">+4°</text>
    <path d="M474 877h286M474 906h143" stroke="#277359" stroke-width="9"/>
    <text x="789" y="884" class="dark">180 ticks per turn</text>
    <text x="789" y="913" class="dark">90 ticks per turn</text>
  </g>
</svg>
