[package]
name = "mirui-macros"
version = "0.54.0"
edition = "2024"
authors = ["Benign X <1341398182@qq.com>"]
license = "MIT"
description = "Declarative UI DSL macro for mirui — powered by xrune"
repository = "https://github.com/W-Mai/mirui"
publish = true

[lib]
proc-macro = true

[package.metadata.ci]
contract-tests = ["animate_contracts", "component_contracts", "compose_contracts", "event_contracts", "model_cross_crate", "system_contracts", "timer_contracts", "trybuild", "view_contracts"]

[dependencies]
xrune = "1.10"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1"
mirui = { path = ".." }
