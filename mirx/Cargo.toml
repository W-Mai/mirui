[package]
name = "mirx"
version = "0.43.0"
edition = "2024"
rust-version = "1.85"
authors = ["Benign X <1341398182@qq.com>"]
license = "MIT"
description = "MIRX binary image format — flat & chunk-based container for ahead-of-time UI assets"
repository = "https://github.com/W-Mai/mirui"
readme = "README.md"
keywords = ["mirx", "mirui", "image", "binary", "texture"]
categories = [
    "multimedia::images",
    "encoding",
    "embedded",
    "no-std",
    "graphics",
]
publish = true

[lib]

[features]
default = []
std = []

[dependencies]
ttf-parser = { version = "0.25.1", default-features = false, features = ["no-std-float"] }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "wasm32"))'.dependencies]
wide = { version = "0.7.33", default-features = false }
