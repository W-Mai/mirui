<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">MIRX architecture</title>
  <desc id="desc">Source assets flow through checked encoding into FLAT or CHUNK bytes. Reader serves borrowed runtime views while Document provides copy-on-write authoring.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f6f2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:url(#hero)} .card{fill:#fff;stroke:#d8e2ef;stroke-width:1.5}.core{fill:#0f172a}.soft{fill:#f8fafc;stroke:#d8e2ef;stroke-width:1.5}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)} .wire{fill:none;stroke:#64748b;stroke-width:2}.dash{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
      .title{fill:#0f172a;font:700 22px system-ui,sans-serif}.label{fill:#0f172a;font:650 15px system-ui,sans-serif}.body{fill:#64748b;font:12px system-ui,sans-serif}.mono{fill:#334155;font:600 12px ui-monospace,monospace}.inverse{fill:#fff}.accent{fill:#2563eb}.violet{fill:#7c3aed}.green{fill:#059669}
      @media(prefers-color-scheme:dark){.bg{fill:#0b1120}.card{fill:#111827;stroke:#334155}.soft{fill:#0f172a;stroke:#334155}.core{fill:#172033}.title,.label{fill:#f8fafc}.body{fill:#94a3b8}.mono{fill:#cbd5e1}.line,.wire{stroke:#64748b}.dash{stroke:#475569}}
    </style>
  </defs>
  <rect class="bg" width="960" height="430" rx="24"/>
  <text class="title" x="40" y="48">Two layouts, shared read and edit paths</text>
  <text class="body" x="40" y="72">Ahead-of-time assets remain compact at rest and explicit in memory.</text>

  <g transform="translate(40 112)">
    <rect class="card" width="190" height="238" rx="16"/>
    <circle cx="32" cy="34" r="14" fill="#dbeafe"/><path d="M25 34h14M32 27v14" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text class="label" x="54" y="39">Source assets</text>
    <g transform="translate(18 70)">
      <rect class="soft" width="72" height="42" rx="8"/><text class="mono" x="36" y="21" text-anchor="middle" dominant-baseline="middle">pixels</text>
      <rect class="soft" x="82" width="72" height="42" rx="8"/><text class="mono" x="118" y="21" text-anchor="middle" dominant-baseline="middle">glyphs</text>
      <rect class="soft" y="52" width="72" height="42" rx="8"/><text class="mono" x="36" y="73" text-anchor="middle" dominant-baseline="middle">scene</text>
      <rect class="soft" x="82" y="52" width="72" height="42" rx="8"/><text class="mono" x="118" y="73" text-anchor="middle" dominant-baseline="middle">meta</text>
      <rect class="soft" y="104" width="72" height="42" rx="8"/><text class="mono" x="36" y="125" text-anchor="middle" dominant-baseline="middle">colors</text>
      <rect class="soft" x="82" y="104" width="72" height="42" rx="8"/><text class="mono" x="118" y="125" text-anchor="middle" dominant-baseline="middle">frames</text>
    </g>
  </g>

  <path class="line" d="M238 231H292"/>
  <g transform="translate(300 152)">
    <rect class="core" width="176" height="158" rx="18"/>
    <text class="inverse" x="24" y="36" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Checked encoder</text>
    <text x="24" y="65" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">size + offsets</text>
    <text x="24" y="86" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">alignment + limits</text>
    <text x="24" y="107" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">headers + CRC</text>
    <rect x="24" y="124" width="128" height="3" rx="1.5" fill="#334155"/>
    <rect x="24" y="124" width="92" height="3" rx="1.5" fill="#38bdf8"/>
  </g>

  <path class="wire" d="M476 231H500M500 166V296"/>
  <circle cx="500" cy="231" r="4" fill="#64748b"/>
  <path class="line" d="M500 166H532" data-audit-center-y-with="flat-layout-card"/>
  <path class="line" d="M500 296H532" data-audit-center-y-with="chunk-layout-card"/>
  <g transform="translate(540 123)">
    <rect x="0" y="0" width="138" height="86" rx="14" fill="#2563eb" data-audit-boundary="flat-layout-card"/>
    <g data-audit-contained-by="flat-layout-card" data-audit-min-inset="8 10 8 10"><text x="20" y="34" class="inverse" font-family="system-ui,sans-serif" font-size="17" font-weight="750">FLAT</text><text x="20" y="57" fill="#dbeafe" font-family="system-ui,sans-serif" font-size="12">single image</text><text x="20" y="74" fill="#dbeafe" font-family="system-ui,sans-serif" font-size="12">28-byte header</text></g>
    <rect x="0" y="130" width="138" height="86" rx="14" fill="#7c3aed" data-audit-boundary="chunk-layout-card"/>
    <g data-audit-contained-by="chunk-layout-card" data-audit-min-inset="8 10 8 10"><text x="20" y="164" class="inverse" font-family="system-ui,sans-serif" font-size="17" font-weight="750">CHUNK</text><text x="20" y="187" fill="#ede9fe" font-family="system-ui,sans-serif" font-size="12">ordered payloads</text><text x="20" y="204" fill="#ede9fe" font-family="system-ui,sans-serif" font-size="12">open type space</text></g>
  </g>

  <path class="wire" d="M686 166H712V296M686 296H712"/>
  <circle cx="712" cy="231" r="4" fill="#64748b"/>
  <path class="line" d="M712 166H734" data-audit-center-y-with="reader-card"/>
  <path class="line" d="M712 296H734" data-audit-center-y-with="document-card"/>
  <g transform="translate(742 112)">
    <rect class="card" width="178" height="108" rx="16" data-audit-boundary="reader-card"/>
    <circle cx="30" cy="30" r="10" fill="#d1fae5"/><path d="M25 30l4 4 7-9" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="50" y="35">Reader</text>
    <text class="body" x="20" y="65">borrowed views</text>
    <text class="body" x="20" y="84">zero allocation</text>
    <text class="mono green" x="20" y="101">runtime</text>

    <rect class="card" y="130" width="178" height="108" rx="16" data-audit-boundary="document-card"/>
    <circle cx="30" cy="160" r="10" fill="#ede9fe"/><path d="M25 160h10M30 155v10" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <text class="label" x="50" y="165">Document</text>
    <text class="body" x="20" y="195">copy-on-write</text>
    <text class="body" x="20" y="214">transactional edits</text>
    <text class="mono violet" x="20" y="231">authoring</text>
  </g>
  <path class="dash" d="M140 382H790"/>
  <text class="body" x="40" y="388">no_std + alloc</text>
  <text class="body" x="810" y="388">deterministic bytes</text>
</svg>
