<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">MIRX copy-on-write editing</title>
  <desc id="desc">Opening a document creates a small node table that points into source bytes. Editing one payload materializes only that value, then atomically replaces the corresponding node after validation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5}.source{fill:#e0f2fe;stroke:#7dd3fc}.owned{fill:#ede9fe;stroke:#c4b5fd}.ok{fill:#d1fae5;stroke:#6ee7b7}.line{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}.borrow{fill:none;stroke:#0ea5e9;stroke-width:1.6}.mutate{fill:none;stroke:#8b5cf6;stroke-width:2;marker-end:url(#arrow)}
      .title{fill:#0f172a;font:700 20px system-ui,sans-serif}.head{fill:#0f172a;font:700 14px system-ui,sans-serif}.body{fill:#64748b;font:12px system-ui,sans-serif}.mono{fill:#334155;font:600 11px ui-monospace,monospace}.small{fill:#64748b;font:10px system-ui,sans-serif}
      @media(prefers-color-scheme:dark){.bg{fill:#0b1120}.card{fill:#111827;stroke:#334155}.source{fill:#082f49;stroke:#0369a1}.owned{fill:#2e1065;stroke:#7c3aed}.ok{fill:#052e2b;stroke:#059669}.title,.head{fill:#f8fafc}.body,.small{fill:#94a3b8}.mono{fill:#cbd5e1}}
    </style>
  </defs>
  <rect class="bg" width="960" height="400" rx="24"/>
  <text class="title" x="40" y="46">A mutation pays only for the payload it changes</text>
  <text class="body" x="40" y="69">Untouched records continue to point at the original source throughout the edit.</text>

  <g transform="translate(40 106)">
    <text class="head" x="0" y="0">Source bytes</text>
    <rect class="source" y="18" width="250" height="56" rx="10"/><text class="mono" x="16" y="51">IMAGE  · borrowed range</text>
    <rect class="source" y="82" width="250" height="56" rx="10"/><text class="mono" x="16" y="115">META   · borrowed range</text>
    <rect class="source" y="146" width="250" height="56" rx="10"/><text class="mono" x="16" y="179">FONT   · borrowed range</text>
    <text class="small" x="0" y="226">Document::open borrows one &amp;[u8]</text>
  </g>

  <g transform="translate(354 106)">
    <text class="head" x="0" y="0">Document nodes</text>
    <rect class="card" y="18" width="210" height="56" rx="10"/><circle cx="26" cy="46" r="7" fill="#0ea5e9"/><text class="mono" x="44" y="50">ChunkId(0)</text>
    <rect class="card" y="82" width="210" height="56" rx="10"/><circle cx="26" cy="110" r="7" fill="#8b5cf6"/><text class="mono" x="44" y="114">ChunkId(1)</text>
    <rect class="card" y="146" width="210" height="56" rx="10"/><circle cx="26" cy="174" r="7" fill="#0ea5e9"/><text class="mono" x="44" y="178">ChunkId(2)</text>
    <text class="small" x="0" y="226">one O(chunk_count) node table</text>
  </g>
  <path class="borrow" d="M290 152H354"/><path class="borrow" d="M290 216H354"/><path class="borrow" d="M290 280H354"/>

  <path class="mutate" d="M572 216H638"/>
  <text class="small" x="579" y="202">edit_meta</text>

  <g transform="translate(646 106)">
    <text class="head" x="0" y="0">Transactional replacement</text>
    <rect class="owned" y="18" width="274" height="56" rx="10"/><text class="mono" x="16" y="42">1 · decode selected payload</text><text class="small" x="16" y="59">working value owns only META data</text>
    <rect class="owned" y="82" width="274" height="56" rx="10"/><text class="mono" x="16" y="106">2 · edit working value</text><text class="small" x="16" y="123">drop discards working state</text>
    <rect class="ok" y="146" width="274" height="56" rx="10"/><text class="mono" x="16" y="170">3 · encode then commit</text><text class="small" x="16" y="187">node 1 swaps to owned bytes</text>
    <text class="small" x="0" y="226">IMAGE and FONT remain borrowed</text>
  </g>

  <g transform="translate(40 354)">
    <circle cx="5" cy="-4" r="5" fill="#0ea5e9"/><text class="body" x="18" y="0">borrowed</text>
    <circle cx="107" cy="-4" r="5" fill="#8b5cf6"/><text class="body" x="120" y="0">materialized</text>
    <circle cx="230" cy="-4" r="5" fill="#10b981"/><text class="body" x="243" y="0">committed</text>
  </g>
</svg>
